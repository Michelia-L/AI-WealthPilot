<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#c9a227" opacity="0.35"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#d4b36a"/>
    </marker>
  </defs>

  <rect width="1240" height="740" fill="#0f1218" rx="16"/>

  <!-- Title -->
  <rect x="400" y="20" width="440" height="46" fill="url(#dots)" rx="6"/>
  <text x="620" y="53" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="700" fill="#ece5d3">Layered System Architecture</text>

  <!-- Band 1: Frontend -->
  <rect x="100" y="96" width="1040" height="132" rx="16" fill="#171c26" stroke="#2c3342" stroke-width="1.5"/>
  <text x="130" y="130" font-size="19" font-weight="700" fill="#c9a227">Frontend · web/ — Next.js 16 + React 19</text>
  <g font-size="15" fill="#ece5d3" text-anchor="middle">
    <rect x="121" y="156" width="190" height="42" rx="21" fill="#10151f" stroke="#c9a227" stroke-width="1.2"/>
    <text x="216" y="183">Ink &amp; Gold UI</text>
    <rect x="323" y="156" width="190" height="42" rx="21" fill="#10151f" stroke="#c9a227" stroke-width="1.2"/>
    <text x="418" y="183">Plotly Charts</text>
    <rect x="525" y="156" width="190" height="42" rx="21" fill="#10151f" stroke="#c9a227" stroke-width="1.2"/>
    <text x="620" y="183">Bilingual i18n</text>
    <rect x="727" y="156" width="190" height="42" rx="21" fill="#10151f" stroke="#c9a227" stroke-width="1.2"/>
    <text x="822" y="183">Advisor Workspace</text>
    <rect x="929" y="156" width="190" height="42" rx="21" fill="#10151f" stroke="#c9a227" stroke-width="1.2"/>
    <text x="1024" y="183">Fleet Dashboard</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="620" y1="230" x2="620" y2="266" stroke="#d4b36a" stroke-width="3.5" marker-end="url(#arrow)"/>
  <text x="640" y="254" font-size="14.5" fill="#98a2b3">same-origin proxy /api/*</text>

  <!-- Band 2: Transport -->
  <rect x="100" y="272" width="1040" height="132" rx="16" fill="#171c26" stroke="#2c3342" stroke-width="1.5"/>
  <text x="130" y="306" font-size="19" font-weight="700" fill="#c9a227">Transport · api/ — FastAPI thin shell, zero business logic</text>
  <g font-size="15" fill="#ece5d3" text-anchor="middle">
    <rect x="142" y="332" width="230" height="42" rx="21" fill="#10151f" stroke="#c9a227" stroke-width="1.2"/>
    <text x="257" y="359">FastAPI Routers</text>
    <rect x="384" y="332" width="230" height="42" rx="21" fill="#10151f" stroke="#c9a227" stroke-width="1.2"/>
    <text x="499" y="359">SSE Task Bus</text>
    <rect x="626" y="332" width="230" height="42" rx="21" fill="#10151f" stroke="#c9a227" stroke-width="1.2"/>
    <text x="741" y="359">SQLite + SQLModel</text>
    <rect x="868" y="332" width="230" height="42" rx="21" fill="#10151f" stroke="#c9a227" stroke-width="1.2"/>
    <text x="983" y="359">i18n Catalog</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="620" y1="406" x2="620" y2="442" stroke="#d4b36a" stroke-width="3.5" marker-end="url(#arrow)"/>
  <text x="640" y="430" font-size="14.5" fill="#98a2b3">calls the src/ computation core</text>

  <!-- Band 3: Engine -->
  <rect x="100" y="448" width="1040" height="252" rx="16" fill="#171c26" stroke="#2c3342" stroke-width="1.5"/>
  <text x="130" y="482" font-size="19" font-weight="700" fill="#c9a227">Core · src/ — quantitative engine &amp; AI agents</text>

  <g text-anchor="middle">
    <rect x="107" y="498" width="326" height="186" rx="14" fill="#10151f" stroke="#c9a227" stroke-width="1.4" stroke-dasharray="8 6"/>
    <text x="270" y="530" font-size="18" font-weight="700" fill="#ece5d3">Quant Engine</text>
    <g font-size="14.5" fill="#98a2b3">
      <text x="270" y="558">MVO · Resampled · BL</text>
      <text x="270" y="581">Mean-CVaR · LDI · ERC</text>
      <text x="270" y="604">CME Engine</text>
      <text x="270" y="627">Backtest · Attribution</text>
      <text x="270" y="650">GBM Monte Carlo</text>
      <text x="270" y="673">Fleet Monitoring</text>
    </g>

    <rect x="457" y="498" width="326" height="186" rx="14" fill="#10151f" stroke="#c9a227" stroke-width="1.4" stroke-dasharray="8 6"/>
    <text x="620" y="530" font-size="18" font-weight="700" fill="#ece5d3">AI Agents</text>
    <g font-size="14.5" fill="#98a2b3">
      <text x="620" y="558">LangGraph IPS Workflow</text>
      <text x="620" y="581">Advisor · streaming CoT</text>
      <text x="620" y="604">Rebalance Advisor</text>
      <text x="620" y="627">Client Profiler</text>
      <text x="620" y="650">Report Storage</text>
      <text x="620" y="673">Demo Fixtures</text>
    </g>

    <rect x="807" y="498" width="326" height="186" rx="14" fill="#10151f" stroke="#c9a227" stroke-width="1.4" stroke-dasharray="8 6"/>
    <text x="970" y="530" font-size="18" font-weight="700" fill="#ece5d3">Data Adapters</text>
    <g font-size="14.5" fill="#98a2b3">
      <text x="970" y="558">yfinance · akshare</text>
      <text x="970" y="581">Tushare Pro</text>
      <text x="970" y="604">Yield Curves</text>
      <text x="970" y="627">Implied Volatility</text>
      <text x="970" y="650">Demo Market (offline)</text>
    </g>
  </g>
</svg>
