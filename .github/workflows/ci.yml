# CI — 让 README 的 Build 徽章名副其实。
# push 到 main 与 PR 时运行：Python 全套测试（含覆盖率 gate + pip-audit
# CVE 扫描）+ 前端 vitest/lint/build。

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        # Upgrade pip/setuptools first so pip-audit below audits the project
        # deps, not CVEs in the interpreter-bundled tooling itself.
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements-dev.txt

      # IPS PDF tests render CJK text — without a CJK-capable font fpdf2
      # raises on non-latin-1 characters. Mirror api/Dockerfile: WenQuanYi
      # Micro Hei linked into the path _find_cjk_font probes.
      - name: Install CJK font for PDF tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-wqy-microhei
          sudo mkdir -p /usr/share/fonts/truetype/noto
          sudo ln -sf /usr/share/fonts/truetype/wqy/wqy-microhei.ttc \
            /usr/share/fonts/truetype/noto/NotoSansCJK-Regular.ttc

      - name: Run test suite
        # Gate at 87%: measured 92% on the pinned dependency set (2026-08),
        # minus 5pp headroom so routine changes don't trip the gate.
        run: python -m pytest -q --cov=src --cov=api --cov-report=term-missing --cov-report=xml --cov-fail-under=87

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

      - name: Audit dependencies for known CVEs
        run: pip-audit

  web:
    name: Web (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test (vitest)
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright, demo-mode backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install API dependencies
        working-directory: .
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The config's webServer block boots uvicorn (DEMO_MODE=1, throwaway
      # SQLite) and next start on dedicated ports 8300/3300.
      - name: Run e2e suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore
