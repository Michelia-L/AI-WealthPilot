# PR checks follow changed paths; main pushes and manual runs check everything.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.scope.outputs.python }}
      web: ${{ steps.scope.outputs.web }}
      e2e: ${{ steps.scope.outputs.e2e }}
      docs: ${{ steps.scope.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test CI selection rules
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Select checks from PR diff
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/ci_scope.py

  python:
    name: Python (pytest)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        # Upgrade pip/setuptools first so pip-audit below audits the project
        # deps, not CVEs in the interpreter-bundled tooling itself.
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements-dev.txt

      # Fail fast on lint/format before the slow test suite starts.
      - name: Ruff lint
        run: ruff check

      - name: Ruff format check
        run: ruff format --check

      # IPS PDF tests render CJK text — without a CJK-capable font fpdf2
      # raises on non-latin-1 characters. Mirror api/Dockerfile: WenQuanYi
      # Micro Hei linked into the path _find_cjk_font probes.
      - name: Install CJK font for PDF tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-wqy-microhei
          sudo mkdir -p /usr/share/fonts/truetype/noto
          sudo ln -sf /usr/share/fonts/truetype/wqy/wqy-microhei.ttc \
            /usr/share/fonts/truetype/noto/NotoSansCJK-Regular.ttc

      - name: Run test suite
        # Gate at 87%: measured 92% on the pinned dependency set (2026-08),
        # minus 5pp headroom so routine changes don't trip the gate.
        run: python -m pytest -q --durations=20 --cov=src --cov=api --cov=validation --cov-report=term-missing --cov-report=xml --cov-fail-under=87

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

      - name: Audit dependencies for known CVEs
        run: pip-audit

  web:
    name: Web (lint + build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (vitest)
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright, demo-mode backend)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install API dependencies
        working-directory: .
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The config's webServer block boots uvicorn (DEMO_MODE=1, throwaway
      # SQLite) and next start on dedicated ports 8300/3300.
      - name: Run e2e suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore

  docs:
    name: Docs (MkDocs)
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install docs dependencies
        run: pip install $(grep -E '^(mkdocs-material|jieba)==' requirements-dev.txt | cut -d' ' -f1)
      - run: mkdocs build --strict

  result:
    name: CI result
    if: always()
    needs: [changes, python, web, e2e, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful selected checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          selection = needs["changes"]
          if selection["result"] != "success":
              sys.exit("CI selection failed or was cancelled")
          for job in ("python", "web", "e2e", "docs"):
              enabled = selection["outputs"].get(job)
              if enabled not in ("true", "false"):
                  sys.exit(f"Missing or invalid selection for {job}")
              expected = "success" if enabled == "true" else "skipped"
              if needs[job]["result"] != expected:
                  sys.exit(f"{job}: expected {expected}, got {needs[job]['result']}")
          print("All selected checks passed.")
          PY
