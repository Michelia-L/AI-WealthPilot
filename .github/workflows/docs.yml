# Docs site: build with MkDocs (strict) and deploy to GitHub Pages.
# Runs only when site sources change; the main CI (ci.yml) is unaffected.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "guide/**"
      - "mkdocs.yml"
      - "requirements-dev.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # Install only the docs toolchain (pins single-sourced from requirements-dev.txt;
      # cut strips any trailing inline comments)
      - name: Install docs dependencies
        run: pip install $(grep -E '^(mkdocs-material|jieba)==' requirements-dev.txt | cut -d' ' -f1)
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
