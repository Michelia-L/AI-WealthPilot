<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif">
  <defs>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#c9a227" opacity="0.35"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#d4b36a"/>
    </marker>
  </defs>

  <rect width="1240" height="740" fill="#0f1218" rx="16"/>

  <!-- Title -->
  <rect x="460" y="20" width="320" height="46" fill="url(#dots)" rx="6"/>
  <text x="620" y="53" text-anchor="middle" font-family="Georgia, 'Noto Serif SC', serif" font-size="31" font-weight="700" fill="#ece5d3">分层系统架构</text>

  <!-- Band 1: Frontend -->
  <rect x="100" y="96" width="1040" height="132" rx="16" fill="#171c26" stroke="#2c3342" stroke-width="1.5"/>
  <text x="130" y="130" font-size="19" font-weight="700" fill="#c9a227">前端 · web/ — Next.js 16 + React 19</text>
  <g font-size="15" fill="#ece5d3" text-anchor="middle">
    <rect x="121" y="156" width="190" height="42" rx="21" fill="#10151f" stroke="#c9a227" stroke-width="1.2"/>
    <text x="216" y="183">墨金私行 UI</text>
    <rect x="323" y="156" width="190" height="42" rx="21" fill="#10151f" stroke="#c9a227" stroke-width="1.2"/>
    <text x="418" y="183">Plotly 图表</text>
    <rect x="525" y="156" width="190" height="42" rx="21" fill="#10151f" stroke="#c9a227" stroke-width="1.2"/>
    <text x="620" y="183">双语 i18n</text>
    <rect x="727" y="156" width="190" height="42" rx="21" fill="#10151f" stroke="#c9a227" stroke-width="1.2"/>
    <text x="822" y="183">顾问工作区</text>
    <rect x="929" y="156" width="190" height="42" rx="21" fill="#10151f" stroke="#c9a227" stroke-width="1.2"/>
    <text x="1024" y="183">组合监控大盘</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="620" y1="230" x2="620" y2="266" stroke="#d4b36a" stroke-width="3.5" marker-end="url(#arrow)"/>
  <text x="640" y="254" font-size="14.5" fill="#98a2b3">同源代理 /api/*</text>

  <!-- Band 2: Transport -->
  <rect x="100" y="272" width="1040" height="132" rx="16" fill="#171c26" stroke="#2c3342" stroke-width="1.5"/>
  <text x="130" y="306" font-size="19" font-weight="700" fill="#c9a227">传输层 · api/ — FastAPI 薄壳，零业务逻辑</text>
  <g font-size="15" fill="#ece5d3" text-anchor="middle">
    <rect x="142" y="332" width="230" height="42" rx="21" fill="#10151f" stroke="#c9a227" stroke-width="1.2"/>
    <text x="257" y="359">FastAPI 路由群</text>
    <rect x="384" y="332" width="230" height="42" rx="21" fill="#10151f" stroke="#c9a227" stroke-width="1.2"/>
    <text x="499" y="359">SSE 任务总线</text>
    <rect x="626" y="332" width="230" height="42" rx="21" fill="#10151f" stroke="#c9a227" stroke-width="1.2"/>
    <text x="741" y="359">SQLite + SQLModel</text>
    <rect x="868" y="332" width="230" height="42" rx="21" fill="#10151f" stroke="#c9a227" stroke-width="1.2"/>
    <text x="983" y="359">i18n 消息表</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="620" y1="406" x2="620" y2="442" stroke="#d4b36a" stroke-width="3.5" marker-end="url(#arrow)"/>
  <text x="640" y="430" font-size="14.5" fill="#98a2b3">调用 src/ 计算核心</text>

  <!-- Band 3: Engine -->
  <rect x="100" y="448" width="1040" height="252" rx="16" fill="#171c26" stroke="#2c3342" stroke-width="1.5"/>
  <text x="130" y="482" font-size="19" font-weight="700" fill="#c9a227">核心 · src/ — 量化引擎与 AI 智能体</text>

  <g text-anchor="middle">
    <rect x="107" y="498" width="326" height="186" rx="14" fill="#10151f" stroke="#c9a227" stroke-width="1.4" stroke-dasharray="8 6"/>
    <text x="270" y="530" font-size="18" font-weight="700" fill="#ece5d3">量化引擎</text>
    <g font-size="14.5" fill="#98a2b3">
      <text x="270" y="558">MVO · 重采样 · BL</text>
      <text x="270" y="581">Mean-CVaR · LDI · ERC</text>
      <text x="270" y="604">CME 引擎</text>
      <text x="270" y="627">回测 · Brinson 归因</text>
      <text x="270" y="650">GBM 蒙特卡洛</text>
      <text x="270" y="673">组合偏离监控</text>
    </g>

    <rect x="457" y="498" width="326" height="186" rx="14" fill="#10151f" stroke="#c9a227" stroke-width="1.4" stroke-dasharray="8 6"/>
    <text x="620" y="530" font-size="18" font-weight="700" fill="#ece5d3">AI 智能体</text>
    <g font-size="14.5" fill="#98a2b3">
      <text x="620" y="558">LangGraph IPS 流水线</text>
      <text x="620" y="581">顾问 · 流式思维链</text>
      <text x="620" y="604">调仓建议 Agent</text>
      <text x="620" y="627">客户画像引擎</text>
      <text x="620" y="650">交付物存储</text>
      <text x="620" y="673">演示模式夹具</text>
    </g>

    <rect x="807" y="498" width="326" height="186" rx="14" fill="#10151f" stroke="#c9a227" stroke-width="1.4" stroke-dasharray="8 6"/>
    <text x="970" y="530" font-size="18" font-weight="700" fill="#ece5d3">数据管道</text>
    <g font-size="14.5" fill="#98a2b3">
      <text x="970" y="558">yfinance · akshare</text>
      <text x="970" y="581">Tushare Pro</text>
      <text x="970" y="604">收益率曲线</text>
      <text x="970" y="627">隐含波动率</text>
      <text x="970" y="650">离线合成行情</text>
    </g>
  </g>
</svg>
